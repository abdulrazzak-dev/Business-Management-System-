<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - Golden Business Management System</title>
  
  <!-- FontAwesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <!-- Core Styles -->
  <link rel="stylesheet" href="css/style.css">
  
  <style>
    .login-wrapper {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
      padding: 1.5rem;
      position: relative;
    }

    .login-card {
      background: var(--bg-surface);
      width: 100%;
      max-width: 440px;
      padding: 2.5rem;
      border-radius: var(--radius-lg);
      box-shadow: var(--shadow-xl);
      border: 1px solid var(--border-color);
      animation: fadeInScale 0.4s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .login-brand {
      text-align: center;
      margin-bottom: 2rem;
    }

    .login-logo {
      width: 56px;
      height: 56px;
      background: linear-gradient(135deg, var(--primary), var(--secondary));
      color: #ffffff;
      border-radius: var(--radius-md);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 1.75rem;
      margin-bottom: 0.75rem;
      box-shadow: 0 8px 20px rgba(59, 130, 246, 0.4);
    }

    .login-title {
      font-size: 1.5rem;
      font-weight: 800;
      letter-spacing: -0.02em;
    }

    .login-subtitle {
      font-size: 0.875rem;
      color: var(--text-muted);
      margin-top: 0.25rem;
    }

    .login-footer-links {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-top: 0.5rem;
      font-size: 0.8125rem;
    }

    .demo-credentials-alert {
      background: var(--primary-light);
      border: 1px dashed var(--primary);
      border-radius: var(--radius-md);
      padding: 0.875rem;
      margin-bottom: 1.5rem;
      font-size: 0.8125rem;
      color: var(--text-main);
    }

    @keyframes fadeInScale {
      from { opacity: 0; transform: scale(0.95) translateY(10px); }
      to { opacity: 1; transform: scale(1) translateY(0); }
    }
  </style>
</head>
<body>
  <div class="login-wrapper">
    <div class="login-card">
      <div class="login-brand">
        <div class="login-logo"><i class="fa-solid fa-chart-line"></i></div>
        <h1 class="login-title">Golden</h1>
        <p class="login-subtitle">Small Business Management System</p>
      </div>

      <div class="demo-credentials-alert">
        <i class="fa-solid fa-circle-info" style="color:var(--primary); margin-right:0.35rem;"></i>
        <strong>Demo Backend Login:</strong><br>
        Email: <code>admin@Golden.com</code> | Password: <code>admin123</code>
      </div>

      <form id="login-form">
        <div class="form-group">
          <label for="email">Email or Username</label>
          <div class="input-icon-group">
            <i class="fa-regular fa-envelope"></i>
            <input type="email" id="email" class="form-control" placeholder="name@business.com" value="admin@Golden.com" required>
          </div>
        </div>

        <div class="form-group">
          <label for="password">Password</label>
          <div class="input-icon-group">
            <i class="fa-solid fa-lock"></i>
            <input type="password" id="password" class="form-control" placeholder="••••••••" value="admin123" required>
            <i class="fa-regular fa-eye password-toggle" id="toggle-password"></i>
          </div>
        </div>

        <div class="login-footer-links">
          <label style="display:flex; align-items:center; gap:0.375rem; cursor:pointer; font-weight:500;">
            <input type="checkbox" id="remember" checked style="accent-color:var(--primary);"> Remember me
          </label>
          <a href="#" onclick="showToast('Password reset link sent to demo email', 'info'); return false;" style="color:var(--primary); font-weight:600;">Forgot password?</a>
        </div>

        <button type="submit" class="btn btn-primary btn-lg" style="width:100%; margin-top:1.5rem;">
          <i class="fa-solid fa-right-to-bracket"></i> Sign In to Dashboard
        </button>
      </form>
    </div>
  </div>

  <!-- JavaScript Engines -->
  <script src="js/api.js"></script>
  <script src="js/main.js"></script>
  <script src="js/auth.js"></script>
</body>
</html>
