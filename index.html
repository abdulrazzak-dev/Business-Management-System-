<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - Golden Business Management System</title>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Golden - Business Management System</title>

  <!-- URL Tab Favicon Logo -->
  <link rel="icon" type="image/png" href="./logo.png">

  
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/responsive.css">
  <!-- FontAwesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <!-- Core Styles -->
  <link rel="stylesheet" href="css/style.css">
  
  <style>
    .login-wrapper, body.login-page, .auth-container {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, rgba(15, 23, 42, 0.75), rgba(30, 41, 59, 0.65));
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      padding: 1.5rem;
      position: relative;
    }

    .login-card {
      background: #ffffff;
      width: 90%;
      max-width: 420px;
      padding: 2.5rem;
      border-radius: var(--radius-lg);
      box-shadow: var(--shadow-xl);
      border: 1px solid var(--border-color);
      box-sizing: border-box;
      overflow: hidden;
      animation: fadeInScale 0.4s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .login-brand {
      text-align: center;
      margin-bottom: 2rem;
    }

    .login-logo {
      width: 60px;
      height: auto;
      object-fit: contain;
      margin-bottom: 0.75rem;
      display: inline-block;
    }

    .login-title {
      font-size: 1.5rem;
      font-weight: 800;
      letter-spacing: -0.02em;
    }

    .login-subtitle {
      font-size: 0.875rem;
      color: var(--text-muted);
      margin-top: 0.25rem;
    }

    .login-footer-links {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-top: 0.5rem;
      font-size: 0.8125rem;
    }

    .demo-credentials-alert {
      background: var(--primary-light);
      border: 1px dashed var(--primary);
      border-radius: var(--radius-md);
      padding: 0.875rem;
      margin-bottom: 1.5rem;
      font-size: 0.8125rem;
      color: var(--text-main);
    }

    .role-cards-container, .role-selector-container, .role-options, .demo-login-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 12px;
      width: 100%;
      box-sizing: border-box;
      margin-bottom: 1.5rem;
    }

    .role-card, .demo-card {
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      padding: 12px 14px;
      gap: 6px;
      min-width: 0;
      box-sizing: border-box;
      width: 100%;
      border: 1px solid var(--border-color);
      border-radius: var(--radius-md);
      background: var(--bg-surface-subtle, rgba(255, 255, 255, 0.03));
      cursor: pointer;
      transition: all 0.2s ease;
      user-select: none;
    }

    .role-card:hover, .demo-card:hover {
      border-color: var(--primary);
      background: rgba(59, 130, 246, 0.05);
    }

    .role-card.active, .demo-card.active {
      border-color: var(--primary);
      background: rgba(59, 130, 246, 0.1);
      box-shadow: 0 0 0 2px rgba(59, 130, 246, 0.25);
    }

    .role-title, .demo-card-title {
      font-size: 0.95rem;
      font-weight: 600;
      margin: 0;
      white-space: nowrap;
      color: var(--text-main);
    }

    .role-badge-wrapper {
      display: flex;
      align-items: center;
    }

    .role-badge, .demo-badge {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      font-size: 0.72rem;
      padding: 2px 8px;
      border-radius: 12px;
      font-weight: 700;
      text-transform: uppercase;
      white-space: nowrap;
    }

    .badge-admin, .demo-badge-admin {
      background: rgba(99, 102, 241, 0.15);
      color: #818cf8;
    }

    .badge-staff, .demo-badge-staff {
      background: rgba(16, 185, 129, 0.15);
      color: #34d399;
    }

    .role-desc, .demo-card-desc {
      font-size: 0.75rem;
      line-height: 1.35;
      color: #64748b;
      margin: 0;
      word-break: normal;
      overflow-wrap: break-word;
    }

    @media (max-width: 480px) {
      .login-card {
        padding: 1.5rem 1.25rem;
      }
      .demo-login-grid {
        grid-template-columns: 1fr;
        gap: 0.5rem;
      }
      .demo-card {
        padding: 0.75rem;
      }
    }

    @keyframes fadeInScale {
      from { opacity: 0; transform: scale(0.95) translateY(10px); }
      to { opacity: 1; transform: scale(1) translateY(0); }
    }
  </style>
</head>
<body>
  <div class="login-wrapper">
    <div class="login-card">
      <div class="login-brand">
        <img src="logo.png" alt="Golden Logo" class="login-logo">
        <h1 class="login-title">Golden BMS</h1>
        <p class="login-subtitle">Small Business Management System</p>
      </div>

      <!-- Demo Login Quick Select Cards -->
      <div class="role-cards-container demo-login-grid">
        <div class="role-card demo-card active" id="demo-admin-card" data-role="ADMIN" data-email="admin@Golden.com" data-password="admin123">
          <h4 class="role-title demo-card-title">Administrator</h4>
          <div class="role-badge-wrapper">
            <span class="role-badge badge-admin demo-badge demo-badge-admin"><i class="fa-solid fa-user-shield"></i> ADMIN</span>
          </div>
          <p class="role-desc demo-card-desc">Full system access & settings</p>
        </div>

        <div class="role-card demo-card" id="demo-staff-card" data-role="STAFF" data-email="staff@Golden.com" data-password="staff123">
          <h4 class="role-title demo-card-title">Staff Member</h4>
          <div class="role-badge-wrapper">
            <span class="role-badge badge-staff demo-badge demo-badge-staff"><i class="fa-solid fa-user-gear"></i> STAFF</span>
          </div>
          <p class="role-desc demo-card-desc">Limited access for operations</p>
        </div>
      </div>

      <!-- Login Form -->
      <form id="login-form">
        <div class="form-group">
          <label for="email">Email or Username</label>
          <div class="input-icon-group">
            <i class="fa-regular fa-envelope"></i>
            <input type="email" id="email" class="form-control" placeholder="name@business.com" required>
          </div>
        </div>

        <div class="form-group">
          <label for="password">Password</label>
          <div class="input-icon-group">
            <i class="fa-solid fa-lock"></i>
            <input type="password" id="password" class="form-control" placeholder="••••••••" required>
            <i class="fa-regular fa-eye password-toggle" id="toggle-password"></i>
          </div>
        </div>

        <div class="login-footer-links">
          <label style="display:flex; align-items:center; gap:0.375rem; cursor:pointer; font-weight:500;">
            <input type="checkbox" id="remember" checked style="accent-color:var(--primary);"> Remember me
          </label>
          <a href="#" onclick="showToast('Password reset link sent to demo email', 'info'); return false;" style="color:var(--primary); font-weight:600;">Forgot password?</a>
        </div>

        <button type="submit" class="btn btn-primary btn-lg" style="width:100%; margin-top:1.5rem;">
          <i class="fa-solid fa-right-from-bracket"></i> Sign In to Dashboard
        </button>
      </form>
    </div>
  </div>

  <!-- JavaScript Engines -->
  <script src="js/api.js"></script>
  <script src="js/main.js"></script>
  <script src="js/auth.js"></script>
</body>
</html>
