<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - Golden Business Management System</title>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Golden - Business Management System</title>

  <!-- URL Tab Favicon Logo -->
  <link rel="icon" type="image/png" href="./logo.png">

  
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/responsive.css">
  <!-- FontAwesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <!-- Core Styles -->
  <link rel="stylesheet" href="css/style.css">
  
  <style>
    .login-wrapper {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
      padding: 1.5rem;
      position: relative;
    }

    .login-card {
      background: var(--bg-surface);
      width: 100%;
      max-width: 440px;
      padding: 2.5rem;
      border-radius: var(--radius-lg);
      box-shadow: var(--shadow-xl);
      border: 1px solid var(--border-color);
      animation: fadeInScale 0.4s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .login-brand {
      text-align: center;
      margin-bottom: 2rem;
    }

    .login-logo {
      width: 60px;
      height: auto;
      object-fit: contain;
      margin-bottom: 0.75rem;
      display: inline-block;
    }

    .login-title {
      font-size: 1.5rem;
      font-weight: 800;
      letter-spacing: -0.02em;
    }

    .login-subtitle {
      font-size: 0.875rem;
      color: var(--text-muted);
      margin-top: 0.25rem;
    }

    .login-footer-links {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-top: 0.5rem;
      font-size: 0.8125rem;
    }

    .demo-credentials-alert {
      background: var(--primary-light);
      border: 1px dashed var(--primary);
      border-radius: var(--radius-md);
      padding: 0.875rem;
      margin-bottom: 1.5rem;
      font-size: 0.8125rem;
      color: var(--text-main);
    }

    .demo-login-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 0.75rem;
      margin-bottom: 1.5rem;
    }

    .demo-card {
      border: 1px solid var(--border-color);
      border-radius: var(--radius-md);
      padding: 0.75rem;
      background: var(--bg-surface-subtle, rgba(255, 255, 255, 0.03));
      cursor: pointer;
      transition: all 0.2s ease;
      display: flex;
      flex-direction: column;
      gap: 0.25rem;
      user-select: none;
    }

    .demo-card:hover {
      border-color: var(--primary);
      background: rgba(59, 130, 246, 0.05);
    }

    .demo-card.active {
      border-color: var(--primary);
      background: rgba(59, 130, 246, 0.1);
      box-shadow: 0 0 0 2px rgba(59, 130, 246, 0.25);
    }

    .demo-card-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 0.25rem;
    }

    .demo-badge {
      display: inline-flex;
      align-items: center;
      gap: 0.25rem;
      font-size: 0.6875rem;
      font-weight: 700;
      padding: 0.15rem 0.4rem;
      border-radius: var(--radius-full);
      text-transform: uppercase;
    }

    .demo-badge-admin {
      background: rgba(99, 102, 241, 0.15);
      color: #818cf8;
    }

    .demo-badge-staff {
      background: rgba(16, 185, 129, 0.15);
      color: #34d399;
    }

    .demo-card-title {
      font-weight: 700;
      font-size: 0.875rem;
      color: var(--text-main);
    }

    .demo-card-desc {
      font-size: 0.75rem;
      color: var(--text-muted);
      line-height: 1.3;
    }

    @keyframes fadeInScale {
      from { opacity: 0; transform: scale(0.95) translateY(10px); }
      to { opacity: 1; transform: scale(1) translateY(0); }
    }
  </style>
</head>
<body>
  <div class="login-wrapper">
    <div class="login-card">
      <div class="login-brand">
        <img src="logo.png" alt="Golden Logo" class="login-logo">
        <h1 class="login-title">Golden BMS</h1>
        <p class="login-subtitle">Small Business Management System</p>
      </div>

      <!-- Demo Login Quick Select Cards -->
      <div class="demo-login-grid">
        <div class="demo-card active" id="demo-admin-card" data-email="admin@Golden.com" data-password="admin123">
          <div class="demo-card-header">
            <span class="demo-card-title">Administrator</span>
            <span class="demo-badge demo-badge-admin"><i class="fa-solid fa-user-shield"></i> Admin</span>
          </div>
          <div class="demo-card-desc">Full system access & settings</div>
        </div>

        <div class="demo-card" id="demo-staff-card" data-email="staff@Golden.com" data-password="staff123">
          <div class="demo-card-header">
            <span class="demo-card-title">Staff Member</span>
            <span class="demo-badge demo-badge-staff"><i class="fa-solid fa-user-tag"></i> Staff</span>
          </div>
          <div class="demo-card-desc">Limited access for operations</div>
        </div>
      </div>

      <!-- Login Form -->
      <form id="login-form">
        <div class="form-group">
          <label for="email">Email or Username</label>
          <div class="input-icon-group">
            <i class="fa-regular fa-envelope"></i>
            <input type="email" id="email" class="form-control" placeholder="name@business.com" value="admin@Golden.com" required>
          </div>
        </div>

        <div class="form-group">
          <label for="password">Password</label>
          <div class="input-icon-group">
            <i class="fa-solid fa-lock"></i>
            <input type="password" id="password" class="form-control" placeholder="••••••••" value="admin123" required>
            <i class="fa-regular fa-eye password-toggle" id="toggle-password"></i>
          </div>
        </div>

        <div class="login-footer-links">
          <label style="display:flex; align-items:center; gap:0.375rem; cursor:pointer; font-weight:500;">
            <input type="checkbox" id="remember" checked style="accent-color:var(--primary);"> Remember me
          </label>
          <a href="#" onclick="showToast('Password reset link sent to demo email', 'info'); return false;" style="color:var(--primary); font-weight:600;">Forgot password?</a>
        </div>

        <button type="submit" class="btn btn-primary btn-lg" style="width:100%; margin-top:1.5rem;">
          <i class="fa-solid fa-right-to-bracket"></i> Sign In to Dashboard
        </button>

        <div style="text-align:center; margin-top:1.25rem; font-size:0.875rem; color:var(--text-muted);">
          Don't have an account? <a href="#" id="show-register-link" style="color:var(--primary); font-weight:600;">Sign Up</a>
        </div>
      </form>

      <!-- Register Form (Hidden by Default) -->
      <form id="register-form" style="display:none;">
        <div class="form-group">
          <label for="reg-name">Full Name</label>
          <div class="input-icon-group">
            <i class="fa-regular fa-user"></i>
            <input type="text" id="reg-name" class="form-control" placeholder="John Doe" required>
          </div>
        </div>

        <div class="form-group">
          <label for="reg-email">Email Address</label>
          <div class="input-icon-group">
            <i class="fa-regular fa-envelope"></i>
            <input type="email" id="reg-email" class="form-control" placeholder="john@business.com" required>
          </div>
        </div>

        <div class="form-group">
          <label for="reg-password">Password</label>
          <div class="input-icon-group">
            <i class="fa-solid fa-lock"></i>
            <input type="password" id="reg-password" class="form-control" placeholder="At least 6 characters" required>
            <i class="fa-regular fa-eye password-toggle" id="toggle-reg-password"></i>
          </div>
        </div>

        <button type="submit" class="btn btn-primary btn-lg" style="width:100%; margin-top:1.5rem;">
          <i class="fa-solid fa-user-plus"></i> Create Account
        </button>

        <div style="text-align:center; margin-top:1.25rem; font-size:0.875rem; color:var(--text-muted);">
          Already have an account? <a href="#" id="show-login-link" style="color:var(--primary); font-weight:600;">Sign In</a>
        </div>
      </form>
    </div>
  </div>

  <!-- JavaScript Engines -->
  <script src="js/api.js"></script>
  <script src="js/main.js"></script>
  <script src="js/auth.js"></script>
</body>
</html>
