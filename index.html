<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - Golden Business Management System</title>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Golden - Business Management System</title>

  <!-- URL Tab Favicon Logo -->
  <link rel="icon" type="image/png" href="./logo.png">

  
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/responsive.css">
  <!-- FontAwesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <!-- Core Styles -->
  <link rel="stylesheet" href="css/style.css">
  
  <style>
    body.login-page, .login-wrapper, .auth-container, .auth-wrapper {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background-color: #0f172a;
      background-image: url('Back.png'), url('../Back.png'), url('/Back.png');
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      background-attachment: fixed;
      padding: 1.5rem;
      position: relative;
      overflow: hidden;
    }

    .login-wrapper::before, body.login-page::before, .auth-container::before, .auth-wrapper::before {
      content: '';
      position: absolute;
      inset: 0;
      background: rgba(15, 23, 42, 0.45);
      z-index: 1;
    }

    .login-card {
      background: rgba(255, 255, 255, 0.08) !important;
      backdrop-filter: blur(18px) saturate(180%);
      -webkit-backdrop-filter: blur(18px) saturate(180%);
      border: 1px solid rgba(255, 255, 255, 0.25) !important;
      border-radius: 20px !important;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3) !important;
      z-index: 2;
      position: relative;
      width: 90%;
      max-width: 420px;
      padding: 2.5rem;
      box-sizing: border-box;
      overflow: hidden;
      color: #ffffff;
      animation: fadeInScale 0.4s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .login-brand {
      text-align: center;
      margin-bottom: 2rem;
    }

    .login-logo {
      width: 60px;
      height: auto;
      object-fit: contain;
      margin-bottom: 0.75rem;
      display: inline-block;
    }

    .login-title {
      font-size: 1.5rem;
      font-weight: 800;
      letter-spacing: -0.02em;
      color: #ffffff;
    }

    .login-subtitle {
      font-size: 0.875rem;
      color: rgba(255, 255, 255, 0.7);
      margin-top: 0.25rem;
    }

    .login-form label, #login-form label {
      color: rgba(255, 255, 255, 0.9);
      font-size: 0.85rem;
      font-weight: 600;
      margin-bottom: 0.35rem;
      display: block;
    }

    .input-icon-group {
      position: relative;
      display: flex;
      align-items: center;
    }

    .input-icon-group i.fa-regular,
    .input-icon-group i.fa-solid {
      position: absolute;
      left: 0;
      color: rgba(255, 255, 255, 0.7);
    }

    .input-icon-group i.password-toggle {
      left: auto;
      right: 0;
      cursor: pointer;
    }

    .form-control, #login-form .form-control {
      border: none !important;
      border-bottom: 2px solid rgba(255, 255, 255, 0.5) !important;
      background: transparent !important;
      color: #ffffff !important;
      border-radius: 0 !important;
      padding: 0.625rem 2rem 0.625rem 1.75rem !important;
      width: 100%;
      box-sizing: border-box;
      transition: border-color 0.2s ease;
    }

    .form-control:focus, #login-form .form-control:focus {
      border-bottom-color: #ffffff !important;
      box-shadow: none !important;
    }

    .form-control::placeholder, #login-form .form-control::placeholder {
      color: rgba(255, 255, 255, 0.5) !important;
    }

    .login-footer-links {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-top: 1rem;
      font-size: 0.8125rem;
      color: rgba(255, 255, 255, 0.85);
    }

    .login-footer-links a {
      color: #ffffff !important;
    }

    #login-form button[type="submit"], .btn-login-submit {
      background: #ffffff !important;
      color: #0f172a !important;
      border-radius: 8px !important;
      font-weight: 600 !important;
      border: none !important;
      padding: 0.75rem 1.25rem;
      transition: transform 0.15s ease, background 0.15s ease;
    }

    #login-form button[type="submit"]:hover, .btn-login-submit:hover {
      background: rgba(255, 255, 255, 0.9) !important;
      transform: translateY(-1px);
    }

    .role-cards-container, .role-selector-container, .role-options, .demo-login-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 12px;
      width: 100%;
      box-sizing: border-box;
      margin-bottom: 1.5rem;
    }

    .role-card, .demo-card {
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      padding: 12px 14px;
      gap: 6px;
      min-width: 0;
      box-sizing: border-box;
      width: 100%;
      border: 1px solid rgba(255, 255, 255, 0.25);
      border-radius: 12px;
      background: rgba(255, 255, 255, 0.05);
      cursor: pointer;
      transition: all 0.2s ease;
      user-select: none;
      color: #ffffff;
    }

    .role-card:hover, .demo-card:hover {
      border-color: rgba(255, 255, 255, 0.5);
      background: rgba(255, 255, 255, 0.12);
    }

    .role-card.active, .demo-card.active {
      border-color: #ffffff;
      background: rgba(255, 255, 255, 0.2);
      box-shadow: 0 0 0 2px rgba(255, 255, 255, 0.3);
    }

    .role-title, .demo-card-title {
      font-size: 0.95rem;
      font-weight: 600;
      margin: 0;
      white-space: nowrap;
      color: #ffffff;
    }

    .role-badge-wrapper {
      display: flex;
      align-items: center;
    }

    .role-badge, .demo-badge {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      font-size: 0.72rem;
      padding: 2px 8px;
      border-radius: 12px;
      font-weight: 700;
      text-transform: uppercase;
      white-space: nowrap;
    }

    .badge-admin, .demo-badge-admin {
      background: rgba(129, 140, 248, 0.25);
      color: #a5b4fc;
    }

    .badge-staff, .demo-badge-staff {
      background: rgba(52, 211, 153, 0.25);
      color: #6ee7b7;
    }

    .role-desc, .demo-card-desc {
      font-size: 0.75rem;
      line-height: 1.35;
      color: rgba(255, 255, 255, 0.7);
      margin: 0;
      word-break: normal;
      overflow-wrap: break-word;
    }

    @media (max-width: 480px) {
      .login-card {
        padding: 1.5rem 1.25rem;
      }
      .demo-login-grid {
        grid-template-columns: 1fr;
        gap: 0.5rem;
      }
      .demo-card {
        padding: 0.75rem;
      }
    }

    @keyframes fadeInScale {
      from { opacity: 0; transform: scale(0.95) translateY(10px); }
      to { opacity: 1; transform: scale(1) translateY(0); }
    }
  </style>
</head>
<body>
  <div class="login-wrapper">
    <div class="login-card">
      <div class="login-brand">
        <img src="logo.png" alt="Golden Logo" class="login-logo">
        <h1 class="login-title">Golden BMS</h1>
        <p class="login-subtitle">Small Business Management System</p>
      </div>

      <!-- Demo Login Quick Select Cards -->
      <div class="role-cards-container demo-login-grid">
        <div class="role-card demo-card active" id="demo-admin-card" data-role="ADMIN" data-email="admin@Golden.com" data-password="admin123">
          <h4 class="role-title demo-card-title">Administrator</h4>
          <div class="role-badge-wrapper">
            <span class="role-badge badge-admin demo-badge demo-badge-admin"><i class="fa-solid fa-user-shield"></i> ADMIN</span>
          </div>
          <p class="role-desc demo-card-desc">Full system access & settings</p>
        </div>

        <div class="role-card demo-card" id="demo-staff-card" data-role="STAFF" data-email="staff@Golden.com" data-password="staff123">
          <h4 class="role-title demo-card-title">Staff Member</h4>
          <div class="role-badge-wrapper">
            <span class="role-badge badge-staff demo-badge demo-badge-staff"><i class="fa-solid fa-user-gear"></i> STAFF</span>
          </div>
          <p class="role-desc demo-card-desc">Limited access for operations</p>
        </div>
      </div>

      <!-- Login Form -->
      <form id="login-form">
        <div class="form-group">
          <label for="email">Email or Username</label>
          <div class="input-icon-group">
            <i class="fa-regular fa-envelope"></i>
            <input type="email" id="email" class="form-control" placeholder="name@business.com" required>
          </div>
        </div>

        <div class="form-group">
          <label for="password">Password</label>
          <div class="input-icon-group">
            <i class="fa-solid fa-lock"></i>
            <input type="password" id="password" class="form-control" placeholder="••••••••" required>
            <i class="fa-regular fa-eye password-toggle" id="toggle-password"></i>
          </div>
        </div>

        <div class="login-footer-links">
          <label style="display:flex; align-items:center; gap:0.375rem; cursor:pointer; font-weight:500;">
            <input type="checkbox" id="remember" checked style="accent-color:var(--primary);"> Remember me
          </label>
          <a href="#" onclick="showToast('Password reset link sent to demo email', 'info'); return false;" style="color:var(--primary); font-weight:600;">Forgot password?</a>
        </div>

        <button type="submit" class="btn btn-primary btn-lg" style="width:100%; margin-top:1.5rem;">
          <i class="fa-solid fa-right-from-bracket"></i> Sign In to Dashboard
        </button>
      </form>
    </div>
  </div>

  <!-- JavaScript Engines -->
  <script src="js/api.js"></script>
  <script src="js/main.js"></script>
  <script src="js/auth.js"></script>
</body>
</html>
